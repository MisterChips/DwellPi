<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DwellPi - Holiday Program Details</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page" id="dwellpi-holidayprogdetails-page">

        <header class="page-header">
            <a href="/web/holidayprogs.html" class="header-btn left">Holiday<br>Programs</a>
            <div class="header-title">
                <h1>DwellPi</h1>
                <div>Holiday Program Details</div>
            </div>
            <a href="/web/syssettings.html" class="header-btn right">System<br>Settings</a>
        </header>

        <main class="page-content">
            <section class="panel">
                <div class="panel-title-row">
                    <span>Holiday Period Details</span>
                    <div class="detail-actions">
                        <button id="bt-prog-save" class="small-action-btn">Save</button>
                        <button id="bt-prog-copy" class="small-action-btn">Copy</button>
                        <button id="bt-prog-delete" class="small-action-btn danger-btn">Delete</button>
                        <button id="bt-prog-cancel" class="small-action-btn">Cancel</button>
                    </div>
                </div>

                <div class="panel-body">
                    <div class="form-row">
                        <label for="prog-start">Start</label>
                        <input type="datetime-local" id="prog-start">
                    </div>

                    <div class="form-row">
                        <label for="prog-end">End</label>
                        <input type="datetime-local" id="prog-end">
                    </div>

                    <div class="form-row">
                        <label>Systems</label>
                        <div class="days-grid">
                            <label><input type="checkbox" id="sys-ch"> Heat</label>
                            <label><input type="checkbox" id="sys-hw"> Water</label>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="prog-enabled">Active</label>
                        <select id="prog-enabled">
                            <option value="on">On</option>
                            <option value="off">Off</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="prog-note">Note</label>
                        <input type="text" id="prog-note" style="width: 100%;">
                    </div>
                </div>
            </section>

            <section class="system-section">
                <div class="system-line" id="holidayprogdetails-status-line">Holiday program details page ready.</div>
            </section>
        </main>

        <footer class="page-footer">
            <div class="footer-nav">
                <a href="/web/holidayprogs.html">Holiday Programs</a>
                <a href="/web/specialprogs.html">Special Programs</a>
            </div>
        </footer>
    </div>

    <script src="/static/holidayprogdetails.js"></script>
</body>
</html>
