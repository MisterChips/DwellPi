<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DwellPi - Heat Programs</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page" id="dwellpi-chprogs-page">

        <header class="page-header">
            <a href="/" class="header-btn left">Home</a>
            <div class="header-title">
                <h1>DwellPi</h1>
                <div>Heat Programs</div>
            </div>
            <a href="/web/chsettings.html" class="header-btn right">Heating<br>Settings</a>
        </header>

        <main class="page-content">
            <section class="panel">
                <div class="panel-title-row">
                    <span>Heating Programs</span>
                    <button id="bt-chprogs-add" class="small-action-btn">Add</button>
                </div>

                <div class="panel-body">
                    <div class="programs-table-wrap">
                        <table class="programs-table" id="ch-programs-table">
                            <thead>
                                <tr>
                                    <th>Edit</th>
                                    <th>ID</th>
                                    <th>Start - End</th>
                                    <th>Days</th>
                                    <th>Setpoint</th>
                                    <th>Warmup</th>
                                    <th>Enabled</th>
                                    <th>Notes</th>
                                </tr>
                            </thead>
                            <tbody id="ch-programs-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section class="system-section">
                <div class="system-line" id="chprogs-status-line">Programs page ready.</div>
            </section>
        </main>

        <footer class="page-footer">
            <div class="footer-nav">
                <a href="/web/hwprogs.html">Water Programs</a>
                <a href="/web/syssettings.html">System Settings</a>
            </div>
        </footer>
    </div>

    <script src="/static/chprogs.js"></script>
</body>
</html>
