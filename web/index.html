<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DwellPi</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page" id="dwellpi-sys-page">

        <header class="page-header">
            <a href="/web/chsettings.html" class="header-btn left">Heating<br>Settings</a>
            <div class="header-title">
                <h1>DwellPi</h1>
                <div>System Status</div>
            </div>
            <a href="/web/hwsettings.html" class="header-btn right">Water<br>Settings</a>
        </header>

        <main class="page-content">
            <div class="grid-two">

                <div class="system-column">
                    <section class="panel thermometer-panel">
                        <div class="panel-body thermometer-body" id="gauge-container">
                            <canvas id="TemperatureGauge"></canvas>
                        </div>
                    </section>

                    <section class="panel">
                        <div class="panel-title">Setpoint</div>
                        <div class="panel-body setpoint-panel">
                            <div class="stepper-row">
                                <button class="stepper-btn" data-target="ip-index-setpoint" data-step="-0.1">−</button>
                                <input type="number" id="ip-index-setpoint" class="stepper-input big-readout" step="0.1">
                                <button class="stepper-btn" data-target="ip-index-setpoint" data-step="0.1">+</button>
                            </div>
                        </div>
                    </section>

                    <section class="panel">
                        <div class="panel-title-row">
                            <span>Heat</span>
                            <span class="demand-status" id="heat-demand-status">--</span>
                        </div>
                        <div class="panel-subtitle">Boost</div>
                        <div class="panel-body">
                            <input type="text" id="ip-index-heat-boost" class="boost-readout" readonly value="00:00">
                            <div class="button-row button-row-two button-row-large">
                                <button type="button" id="bt-index-heat-boost-plus" class="large-btn">1 Hour</button>
                                <button type="button" id="bt-index-heat-boost-clear" class="large-btn">Clear</button>
                            </div>
                        </div>
                    </section>

                    <section class="panel">
                        <div class="panel-body">
                            <select id="sel-index-heat-switch" class="large-select">
                                <option value="timed">Timed</option>
                                <option value="on">On</option>
                                <option value="off">Off</option>
                                <option value="once">Once</option>
                            </select>
                        </div>
                    </section>

                    <section class="panel">
                        <div class="panel-body">
                            <button type="button" class="advance-btn advance-btn-large" id="bt-index-heat-advance">Advance</button>
                        </div>
                    </section>

                    <section class="panel">
                        <div class="panel-title">Heat programs status</div>
                        <div class="panel-body">
                            <div class="status-body" id="heat-programs-status">--</div>
                            <div class="minor-status">Relay: <span id="relay-a-status">--</span></div>
                        </div>
                    </section>
                </div>

                <div class="system-column">
                    <section class="panel">
                        <div class="panel-title-row">
                            <span>Water</span>
                            <span class="demand-status" id="water-demand-status">--</span>
                        </div>
                        <div class="panel-subtitle">Boost</div>
                        <div class="panel-body">
                            <input type="text" id="ip-index-water-boost" class="boost-readout" readonly value="00:00">
                            <div class="button-row button-row-two button-row-large">
                                <button type="button" id="bt-index-water-boost-plus" class="large-btn">1 Hour</button>
                                <button type="button" id="bt-index-water-boost-clear" class="large-btn">Clear</button>
                            </div>
                        </div>
                    </section>

                    <section class="panel">
                        <div class="panel-body">
                            <select id="sel-index-water-switch" class="large-select">
                                <option value="timed">Timed</option>
                                <option value="on">On</option>
                                <option value="off">Off</option>
                                <option value="once">Once</option>
                            </select>
                        </div>
                    </section>

                    <section class="panel">
                        <div class="panel-body">
                            <button type="button" class="advance-btn advance-btn-large" id="bt-index-water-advance">Advance</button>
                        </div>
                    </section>

                    <section class="panel">
                        <div class="panel-title">Water programs status</div>
                        <div class="panel-body">
                            <div class="status-body" id="water-programs-status">--</div>
                            <div class="minor-status">Relay: <span id="relay-b-status">--</span></div>
                        </div>
                    </section>
                </div>
            </div>

            <section class="system-section">
                <div class="system-line" id="last-message">Last message: --</div>
                <div class="system-line" id="dwellpi-system-status">Updated: --</div>
                <div class="minor-status" id="settings-save-status">Ready</div>
            </section>
        </main>

        <footer class="page-footer">
            <div class="footer-nav">
                <a href="/web/chprogs.html">Heat Programs</a>
                <a href="/web/hwprogs.html">Water Programs</a>
            </div>
        </footer>
    </div>

    <script src="/static/thermometer.js"></script>
    <script src="/static/common.js"></script>
    <script src="/static/index.js"></script>
</body>
</html>
